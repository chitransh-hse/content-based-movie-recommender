<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content-Based Movie Recommender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Content-Based Movie Recommender</h1>
        <p>Select three movies you have watched, and we'll find similar ones for you!</p>

        <div class="controls">
            <select id="movie-select-1">
                <option value="" disabled selected>Select first movie</option>
            </select>

            <select id="movie-select-2">
                <option value="" disabled selected>Select second movie</option>
            </select>

            <select id="movie-select-3">
                <option value="" disabled selected>Select third movie</option>
            </select>

            <button id="recommend-btn" onclick="getRecommendations()">
                Get Recommendations
            </button>
        </div>

        <div id="result-box">
            <p id="result">Please wait, loading data...</p>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
